<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đặt Mua Sách - Nguyễn Nhật Ánh</title>
</head>
<body>
    <header>
        <img src="Img/logo.jpg" alt="Logo" width="200">
        <h1>Thế Giới Truyện Nguyễn Nhật Ánh</h1>
        
        <nav>
            <ul>
                <li><a href="index.html#gioi-thieu">Tác giả</a></li>
                <li><a href="index.html#tac-pham-noibat">Sách nổi bật</a></li>
                <li><a href="tacPham.html">Tất cả tác phẩm</a></li>
                <li><a href="#">Đặt mua sách</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Form Đặt Mua Sách Trực Tuyến</h2>
        <form action="http://httpbin.org/get" method="get">
            <fieldset>
                <legend>Thông tin người nhận</legend>
                <p>
                    <label for="ho-ten">Họ và tên độc giả:</label><br>
                    <input type="text" name="ho-ten" id="ho-ten" placeholder="Nhập họ tên của bạn" required>
                </p>
                <p>
                    <label for="so-dien-thoai">Số điện thoại liên hệ:</label><br>
                    <input type="tel" name="so-dien-thoai" id="so-dien-thoai" placeholder="Nhập số điện thoại" required>
                </p>
                <p>
                    <label for="dia-chi">Địa chỉ nhận hàng:</label><br>
                    <input type="text" name="dia-chi" id="dia-chi" placeholder="Nhập địa chỉ chi tiết">
                </p>
                <p>
                    <label for="ten-sach">Tên cuốn sách muốn đặt & Số lượng:</label><br>
                    <textarea name="ten-sach" id="ten-sach" cols="40" rows="5" placeholder="Ví dụ: Đặt 1 cuốn Mắt Biếc, 1 cuốn Tôi Thấy Hoa Vàng Trên Cỏ Xanh"></textarea>
                </p>
            </fieldset>
            <br>
            <button type="submit">Xác nhận đặt hàng</button>
            <button type="reset">Làm lại</button>
        </form>

        <p><a href="#">Trở về đầu trang</a></p>
    </main>

    <footer>
        <p>Bản quyền &copy; thuộc về Tiệm Sách Nguyễn Nhật Ánh.</p>
    </footer>
</body>
</html>
